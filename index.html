<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Bill Struk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Bill">
<meta name="description" content="Foto struk, bagi tagihan per orang termasuk pajak, lalu bagikan ke grup.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Satu tema terang (sesuai mockup): tinta gelap, teal utama, kuning untuk aksen. Layout: layar HP satu kolom, nav/bar melayang di bawah */
:root{
  --bg:#f3f4f1;
  --paper:#ffffff;
  --ink:#15191e;
  --muted:#5c6670;
  --line:#e3e6e0;
  --teal:#0f766e;
  --teal-2:#14897f;
  --teal-soft:#dff2ee;
  --teal-ink:#0b5d56;
  --yellow:#ffd23f;
  --yellow-soft:#fff3c4;
  --yellow-ink:#6e4b00;
  --orange-soft:#fdeee0;
  --orange-ink:#8f430c;
  --dark:#15191e;
  --dark-2:#2a3038;
  --danger:#b42318;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid color-mix(in srgb,var(--teal) 50%,transparent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:120px}
.top{padding:24px 18px 10px;display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.top h1.big{font-size:28px;letter-spacing:-.03em}
.top .sub{font-size:13px;color:var(--muted);font-weight:600}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
.titlebtn{border:0;background:transparent;padding:0;text-align:left;display:flex;align-items:center;gap:6px;min-width:0}
.titlebtn svg{flex:none;color:var(--muted)}
.btn{position:relative;height:48px;border-radius:15px;border:1px solid var(--line);background:var(--paper);font:700 14px var(--font);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;white-space:nowrap}
.btn input[type=file]{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.big{height:56px;font-size:16px;border-radius:18px;font-weight:800}
.btn.sm{height:36px;border-radius:12px;font-size:13px;padding:0 12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal-ink)}
.pill.warn{background:var(--orange-soft);color:var(--orange-ink)}
.pill.todo{background:var(--yellow-soft);color:var(--yellow-ink)}
.av{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.m{width:22px;height:22px;font-size:10px;border:2px solid #fff}
.av.l{width:44px;height:44px;font-size:17px}
.stack{display:flex;align-items:center}
.stack .av+.av{margin-left:-7px}
/* home */
.hero{margin:10px 18px 0;background:var(--teal);border-radius:28px;padding:24px 22px 22px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.hero .blob{position:absolute;right:-36px;top:-30px;width:170px;height:170px;border-radius:50%;background:var(--teal-2)}
.hero .mini{position:absolute;right:26px;top:26px;width:70px;height:88px;background:#fff;border-radius:8px 8px 0 0;transform:rotate(8deg);display:flex;flex-direction:column;gap:7px;padding:12px 10px}
.hero .mini i{display:block;height:5px;border-radius:3px;background:#cfd6d3}
.hero .mini i:last-child{height:7px;background:var(--yellow);margin-top:4px}
.hero .txt{position:relative;max-width:200px;display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px;color:#d4f0eb}
.hero .acts{position:relative;display:flex;gap:10px}
.hero .acts .btn.yellow{flex:1;height:52px;border-radius:16px;font-size:15px}
.hero .acts .gal{width:52px;height:52px;border-radius:16px;border:1.5px solid #6dbdb4;background:transparent;color:#fff;padding:0}
.quick{margin:14px 18px 0;display:flex;gap:10px}
.quick .btn{flex:1}
.quick .btn svg{color:var(--teal)}
.sec{margin:24px 18px 0;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{font-size:17px;font-weight:800}
.link{border:0;background:none;padding:6px 0;color:var(--teal);font-weight:700;font-size:13px}
.rowc{position:relative;background:var(--paper);border:1px solid #e8eae5;border-radius:20px;display:flex;align-items:stretch;width:100%;overflow:hidden}
.rowmain{flex:1;min-width:0;display:flex;gap:14px;align-items:center;padding:14px 8px 14px 16px;border:0;background:none;text-align:left}
.rowdel{width:46px;flex:none;border:0;border-left:1px solid #eef0ec;background:none;color:#8a949e;display:flex;align-items:center;justify-content:center;padding:0;font:800 12px var(--font);transition:width .15s}
.rowdel.armed{position:absolute;right:0;top:0;bottom:0;width:104px;background:#fde8e6;color:var(--danger);border-left:0;box-shadow:-18px 0 18px -6px rgba(255,255,255,.95);font-size:13px}
.rowmain .mid b,.rowmain .mid span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowc .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.rowc .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rowc .mid b{font-size:15px;overflow-wrap:anywhere}
.rowc .mid span{font-size:13px;color:var(--muted)}
.rowc .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.rowc .end b{font-size:15px;font-weight:800}
.empty{background:var(--paper);border:1.5px dashed #cfd4cc;border-radius:20px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.mode{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(444px,calc(100% - 36px));background:var(--dark);border-radius:22px;height:64px;display:flex;justify-content:space-around;align-items:center;z-index:5}
.nav button{width:76px;height:48px;border-radius:14px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b5bec7;font:700 11px var(--font)}
.nav button[aria-current="page"]{background:var(--dark-2);color:var(--yellow)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat div{background:var(--paper);border:1px solid #e8eae5;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{font-size:19px;font-weight:800}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
.gcard{background:var(--paper);border:1px solid #e8eae5;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gcard .gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gcard .gh b{font-size:16px}
.gcard .names{font-size:13px;color:var(--muted)}
.gcard .ga{display:flex;gap:8px;flex-wrap:wrap}
/* items */
.prow{margin:4px 18px 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font:700 13px var(--font);flex:none;height:36px}
.padd{width:36px;height:36px;border-radius:50%;border:1.5px dashed #8f99a3;background:transparent;display:flex;align-items:center;justify-content:center;flex:none;padding:0;color:var(--muted)}
.padd.wide{width:auto;border-radius:999px;padding:0 14px;gap:6px;font:700 13px var(--font)}
.receipt{margin:16px 14px 0}
.paper{background:var(--paper);border-radius:20px 20px 0 0;padding:6px 18px 6px}
.zig{height:12px;background:radial-gradient(circle at 8px 0,transparent 7px,#ffffff 7.5px) 0 0/16px 12px repeat-x}
.item{display:flex;gap:12px;padding:14px 0;border:0;border-bottom:1px dashed #dcdfd8;width:100%;background:none;text-align:left}
.item .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.item .l b{font-size:15px;overflow-wrap:anywhere}
.item .l b small{color:var(--muted);font-weight:600;font-size:14px}
.item .p{font-weight:700;font-size:15px}
.item .split{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.additem{width:100%;height:48px;border:0;background:none;color:var(--teal);font:700 14px var(--font);display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px dashed #dcdfd8}
.tot{border-top:1.5px solid var(--ink);margin-top:2px;padding:12px 0 6px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#47515b}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .grand{color:var(--ink);font-weight:800;font-size:16px}
.tot .chg{align-self:flex-start;margin-top:4px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(452px,calc(100% - 28px));background:var(--dark);border-radius:22px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:12px;z-index:5}
.bar .bl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bar .bl span{font-size:12px;color:#b5bec7;font-weight:600}
.bar .bl b{font-size:20px;color:#fff;font-weight:800}
.bar .btn{border-radius:15px;font-weight:800;font-size:15px}
.scanbox{margin:16px 18px 0;background:var(--paper);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;color:var(--muted);font-size:14px}
/* summary */
.darkc{margin:6px 18px 0;background:var(--dark);color:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.darkc .s{font-size:13px;color:#b5bec7;font-weight:600;overflow-wrap:anywhere}
.darkc .t{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.darkc .chips{display:flex;gap:6px;flex-wrap:wrap}
.darkc .chips span{font-size:12px;font-weight:600;color:#d3d9de;padding:4px 10px;border-radius:999px;background:var(--dark-2)}
.prog{height:8px;border-radius:4px;background:var(--dark-2);overflow:hidden}
.prog i{display:block;height:8px;background:var(--yellow);border-radius:4px}
.darkc .pt{font-size:13px;color:#d3d9de}
.darkc .pt b{color:var(--yellow)}
.warnbox{background:var(--yellow-soft);color:var(--yellow-ink);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:13.5px}
.warnbox div{flex:1}
.warnbox b{color:#4d3500}
.pcard{background:var(--paper);border:1px solid #e8eae5;border-radius:20px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:center}
.pcard.paid{background:#fbfdfc}
.pcard .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pcard .mid b{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.pcard .mid span{font-size:12.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.pcard .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pcard .end>b{font-size:16px;font-weight:800}
.paybtn{font:700 12px var(--font);padding:5px 10px;border-radius:999px;border:1.5px solid #c9ced3;background:#fff;color:#47515b;display:inline-flex;align-items:center;gap:4px}
.paybtn[aria-pressed="true"]{border-color:var(--teal-soft);background:var(--teal-soft);color:var(--teal-ink)}
.pcard{flex-wrap:wrap}
.pacts{width:100%;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-left:56px;flex-wrap:wrap}
.tagih{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--font);padding:5px 11px;border-radius:999px;background:#e7f6ec;color:#146c3a;text-decoration:none}
.paycard{background:var(--paper);border:1px solid #e8eae5;border-radius:20px;padding:12px 16px 12px 12px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--ink)}
.paycard .ico{width:46px;height:46px;border-radius:14px;background:var(--yellow-soft);color:#9a6a00;display:flex;align-items:center;justify-content:center;flex:none}
.paycard .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.paycard .mid b{font-size:15px}
.paycard .mid span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paycard>svg{color:var(--muted);flex:none}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg span{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.seg button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:700 13px var(--font);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.wlist{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:18px;padding:12px 14px}
.wrow{display:flex;align-items:center;gap:10px}
.wrow .wn{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wa{width:76px;text-align:right;font-weight:700;font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font:800 17px var(--font);padding:0;line-height:1}
.step button:disabled{opacity:.4}
.step b{min-width:18px;text-align:center}
.inp.ta{height:auto;padding:12px 14px;resize:vertical;line-height:1.4}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.namechips button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.pmain{display:flex;gap:12px;align-items:center;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.pmain .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pmain .mid b{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.pmain .mid span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pmain .chev{color:var(--muted);display:flex}
.dcard{background:var(--paper);border:1px solid #e8eae5;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dh{display:flex;gap:10px;align-items:flex-start}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dt b{font-size:15px;overflow-wrap:anywhere}
.dt span{font-size:12.5px;color:var(--muted)}
.iconbtn.sm{width:36px;height:36px;border-radius:12px}
.dl{display:flex;flex-direction:column;gap:5px;font-size:14px;color:#47515b;border-top:1px dashed #dcdfd8;padding-top:10px}
.dl div{display:flex;justify-content:space-between;gap:12px}
.dl div span:first-child{overflow-wrap:anywhere}
.dl .dsum{color:var(--ink);font-weight:800;font-size:15px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.photo{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-height:62vh;overflow:auto;display:flex;flex-direction:column}
.photo img{width:100%;display:block;-webkit-touch-callout:default}
.photo .spin{margin:30px auto}
label.iconbtn{position:relative;cursor:pointer;color:var(--ink)}
.iconbtn{color:var(--ink)}
.rowmain.pick{background:var(--paper);border:1px solid #e8eae5;border-radius:16px;padding:12px 14px;gap:12px}
.rowmain.pick .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowmain.pick .mid b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain.pick .mid span{font-size:12.5px;color:var(--muted)}
.rowmain.pick .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rowmain.pick .end b{font-size:14px}
.evrow{border:1px solid #d6dbd3}
.setbox{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.setbox>b{font-size:14px}
.setbox .inp{background:#fff}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--teal-ink)}
.admacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.admacts .step button{width:30px;height:30px;border-radius:9px;font-size:15px}
.invbox{margin:14px 18px 0;background:var(--yellow-soft);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:var(--yellow-ink)}
.invbox div:first-child{display:flex;flex-direction:column;gap:2px}
.invbox b{color:#4d3500;font-size:15px}
.invbox span{font-size:13px}
.invbox .ia{display:flex;gap:8px;flex-wrap:wrap}
.acts2{margin:18px 18px 0;display:flex;flex-direction:column;gap:10px}
.acts2 .row{display:flex;gap:10px}
.acts2 .row .btn{flex:1}
/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(21,25,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:30px 30px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.grab{width:44px;height:5px;border-radius:3px;background:#d5d9d2;align-self:center;flex:none}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sh h2{font-size:22px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.sh .pr{font-size:20px;font-weight:800;white-space:nowrap}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex:1;min-width:0}
.inp{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font:500 15px var(--font);color:var(--ink);width:100%;min-width:0}
.inp:disabled{color:var(--muted);background:#eef0ec}
.frow{display:flex;gap:10px;align-items:flex-end}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pbtn{height:100px;border-radius:20px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;padding:6px}
.pbtn .nm{font-weight:700;font-size:14px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .av.l{background:color-mix(in srgb,var(--c) 22%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.pbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.pbtn[aria-pressed="true"] .nm{color:var(--ink)}
.pbtn[aria-pressed="true"] .av.l{background:var(--c);color:#fff}
.pbtn .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--c);display:none;align-items:center;justify-content:center;color:#fff}
.pbtn[aria-pressed="true"] .ck{display:flex}
.hint{background:var(--yellow-soft);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--yellow-ink)}
.hint div{display:flex;flex-direction:column;gap:2px;font-size:13px}
.hint b{font-size:14px;color:#4d3500}
.sacts{display:flex;gap:10px}
.sacts .grow{flex:1}
.namechips{display:flex;flex-wrap:wrap;gap:8px}
.namechips button{height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px 0 6px;display:inline-flex;align-items:center;gap:6px;font:700 13px var(--font)}
.namechips button.x{padding:0 6px 0 12px}
.namechips button.x svg{color:var(--muted)}
.crow{display:grid;grid-template-columns:1fr 64px 112px 36px;gap:6px;align-items:center}
.crow .inp{height:44px;padding:0 10px;font-size:14px}
.crow .inp.r{text-align:right}
.crow .x{width:36px;height:36px;border:0;background:none;color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center}
.chead{display:grid;grid-template-columns:1fr 64px 112px 36px;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:12.5px;color:var(--muted);margin:0}
.shot{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:52vh;overflow-y:auto}
.shot img{max-width:100%;display:block;margin:0 auto;border-radius:8px;-webkit-touch-callout:default}
.spin{width:36px;height:36px;border:3.5px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast .tact{border:0;background:none;color:var(--yellow);font:800 14px var(--font);padding:4px 2px}
@media (max-width:370px){.crow,.chead{grid-template-columns:1fr 54px 96px 32px}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  "use strict";
  const COLORS=["#3b6fd8","#d9480f","#7a4fc4","#0f8a5f","#c2255c","#a86b00","#1c7ed6","#6741d9","#e8590c","#2b8a3e"];
  const LKEY="splitbill-v2",OLDKEY="splitbill-v1";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>(n<0?"−":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID");
  const fmtN=n=>(n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("id-ID");
  const num=s=>{const neg=/^\s*[-−]/.test(String(s));const d=String(s).replace(/[^\d]/g,"");const v=d?parseInt(d,10):0;return neg?-v:v;};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const hasPct=c=>c.pct!==null&&c.pct!==undefined&&c.pct!=="";
  const ini=n=>(String(n||"?").trim()[0]||"?").toUpperCase();
  const I={
    cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
    gal:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M15.5 14.6c2.6-.3 4.9 1.3 5.8 4.4"/></svg>',
    home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    receipt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
    back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>',
    share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    edit:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
    gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
    chat:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
    wallet:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/></svg>',
    chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    img:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
    attach:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5 12.6 21a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>',
    flag:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4h11l-1.5 4L15 12H4"/></svg>',
    x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    split:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="6" r="1.5"/><path d="M5 12h14"/><circle cx="12" cy="18" r="1.5"/></svg>',
    cup:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v3M10 2v3M14 2v3"/></svg>'
  };

  /* ---------- state & storage ---------- */
  const S={view:"home",bills:{},groups:[],groupsUpdatedAt:0,settings:{myName:"",payInfo:"",round:0,workerUrl:"",accessCode:""},settingsUpdatedAt:0,events:[],eventsUpdatedAt:0,eventId:null,curId:null,aiMode:"pending",sheet:null,remote:"none"};
  function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY));if(d&&d.bills)return d;}catch(e){}return null;}
  const isEmpty=b=>b&&!b.deleted&&!(b.items&&b.items.length);
  function saveLocal(){
    const keep={};Object.values(S.bills).forEach(b=>{if(b&&!isEmpty(b))keep[b.id]=b;});
    try{localStorage.setItem(LKEY,JSON.stringify({bills:keep,groups:S.groups,groupsUpdatedAt:S.groupsUpdatedAt,settings:S.settings,settingsUpdatedAt:S.settingsUpdatedAt,events:S.events,eventsUpdatedAt:S.eventsUpdatedAt}));}catch(e){}
  }
  (function load(){
    const d=loadLocal();
    if(d){S.bills=d.bills||{};S.groups=d.groups||[];S.groupsUpdatedAt=d.groupsUpdatedAt||0;if(d.settings)S.settings=Object.assign(S.settings,d.settings);S.settingsUpdatedAt=d.settingsUpdatedAt||0;S.events=d.events||[];S.eventsUpdatedAt=d.eventsUpdatedAt||0;return;}
    try{ // bring over the bill from the previous version of the app
      const o=JSON.parse(localStorage.getItem(OLDKEY));
      if(o&&!o.sample&&Array.isArray(o.items)&&o.items.length){
        const id=uid(),now=Date.now();
        S.bills[id]={id,title:o.title||"Tagihan sebelumnya",createdAt:now,updatedAt:now,receiptTotal:o.receiptTotal||null,
          people:(o.people||[]).map(p=>({id:p.id,name:p.name,color:p.color,paid:false})),
          items:o.items.map(i=>({id:i.id||uid(),name:i.name,qty:i.qty||1,price:i.price||0,who:i.who||[]})),
          charges:(o.charges||[]).map(c=>({id:c.id||uid(),name:c.name,pct:hasPct(c)?c.pct:null,amount:c.amount||0}))};
        saveLocal();
      }
    }catch(e){}
  })();
  let inviteApplied=false;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const isStandalone=()=>!!(window.navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
  const validServer=sv=>/^(https:\/\/[^\s/]+|http:\/\/localhost)/.test(sv||"");
  function parseInvite(text){
    const urls=String(text||"").match(/https?:\/\/[^\s<>"']+/g)||[];
    for(const raw of urls){try{const u=new URL(raw.replace(/[).,!>]+$/,""));const sv=u.searchParams.get("server"),kd=u.searchParams.get("kode");if(sv&&kd&&validServer(sv))return {sv:sv.trim(),kd:kd.trim()};}catch(e){}}
    return null;
  }
  function applyInvite(inv){S.settings.workerUrl=inv.sv;S.settings.accessCode=inv.kd;S.settingsUpdatedAt=Date.now();saveLocal();}
  (function readInvite(){
    if(window.claude)return;
    try{
      const inv=parseInvite(location.href);
      if(inv){applyInvite(inv);inviteApplied=true;}
      // iPhone: the Home Screen app starts with its own empty storage, so leave the invite in the address
      // while in Safari; adding to Home Screen from here can then carry it into the app.
      const q=new URLSearchParams(location.search);
      if((q.has("server")||q.has("kode"))&&!(isIOS&&!isStandalone()))history.replaceState(null,"",location.pathname+location.hash);
    }catch(e){}
  })();
  const cur=()=>S.bills[S.curId];
  const billList=()=>Object.values(S.bills).filter(b=>b&&!b.deleted&&!isEmpty(b)).sort((a,b)=>b.createdAt-a.createdAt);

  /* remote: each viewer's own private space in the artifact's store, when available */
  let R=null;const pend={};
  function queueRemote(key,getData){
    if(!R||R.off)return;
    const p=pend[key]||(pend[key]={t:null,busy:false,dirty:false,get:null});
    p.get=getData;clearTimeout(p.t);p.t=setTimeout(()=>flushRemote(key),700);
  }
  async function flushRemote(key){
    const p=pend[key];if(!R||R.off||!p)return;
    if(p.busy){p.dirty=true;return;}
    p.busy=true;
    try{await R.col.doc(key).set(p.get());}
    catch(e){if(e&&["invalid_argument","revoked","not_granted","capability_disabled","capability_removed","quota_exceeded"].includes(e.code)){R.off=true;S.remote="local";if(S.view==="history")render();}}
    p.busy=false;
    if(p.dirty){p.dirty=false;flushRemote(key);}
  }
  function saveBill(b){b.updatedAt=Date.now();S.bills[b.id]=b;saveLocal();if(isEmpty(b))return;const id=b.id;queueRemote("bill-"+id,()=>({bill:S.bills[id]}));}
  function saveSettings(){S.settingsUpdatedAt=Date.now();saveLocal();queueRemote("settings",()=>({settings:S.settings,updatedAt:S.settingsUpdatedAt}));}
  function saveEvents(){S.eventsUpdatedAt=Date.now();saveLocal();queueRemote("events",()=>({list:S.events,updatedAt:S.eventsUpdatedAt}));}
  function saveGroups(){S.groupsUpdatedAt=Date.now();saveLocal();queueRemote("groups",()=>({list:S.groups,updatedAt:S.groupsUpdatedAt}));}
  async function initRemote(){
    try{
      const w=window.claude;if(!w||!w.use){S.remote="local";return;}
      const [db,user]=await Promise.all([w.use("db"),w.use("user")]);
      const id=db&&user?await user.id():null;
      if(!db||!id){S.remote="local";return;}
      const col=db.collection("data/users/"+id);
      const snap=await Promise.race([col.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
      let changed=false;const seen=new Set();
      snap.docs.forEach(d=>{
        const v=d.data()||{};
        if(d.id==="settings"){if((v.updatedAt||0)>(S.settingsUpdatedAt||0)&&v.settings){S.settings=Object.assign({myName:"",payInfo:"",round:0,workerUrl:"",accessCode:""},v.settings);S.settingsUpdatedAt=v.updatedAt;changed=true;}return;}
        if(d.id==="events"){if((v.updatedAt||0)>(S.eventsUpdatedAt||0)&&Array.isArray(v.list)){S.events=v.list;S.eventsUpdatedAt=v.updatedAt;changed=true;}return;}
        if(d.id==="groups"){if((v.updatedAt||0)>(S.groupsUpdatedAt||0)&&Array.isArray(v.list)){S.groups=v.list;S.groupsUpdatedAt=v.updatedAt;changed=true;}return;}
        const b=v.bill;if(!b||!b.id)return;seen.add(b.id);
        const mine=S.bills[b.id];
        if(!mine||(b.updatedAt||0)>(mine.updatedAt||0)){S.bills[b.id]=b;changed=true;}
      });
      R={col,off:false};S.remote="cloud";
      // upload what this device has that the store lacks or has older
      Object.values(S.bills).forEach(b=>{if(!seen.has(b.id)||snap.docs.some(d=>d.id==="bill-"+b.id&&((d.data()||{}).bill||{}).updatedAt<b.updatedAt)){const bid=b.id;queueRemote("bill-"+bid,()=>({bill:S.bills[bid]}));}});
      const evd=snap.docs.find(d=>d.id==="events");
      if(S.events.length&&(!evd||((evd.data()||{}).updatedAt||0)<S.eventsUpdatedAt))queueRemote("events",()=>({list:S.events,updatedAt:S.eventsUpdatedAt}));
      R.photos=db.doc("data/users/"+id+"/photos").collection("p");flushPendingPhotos();
      const st=snap.docs.find(d=>d.id==="settings");
      if(S.settingsUpdatedAt&&(!st||((st.data()||{}).updatedAt||0)<S.settingsUpdatedAt))queueRemote("settings",()=>({settings:S.settings,updatedAt:S.settingsUpdatedAt}));
      const g=snap.docs.find(d=>d.id==="groups");
      if(S.groups.length&&(!g||((g.data()||{}).updatedAt||0)<S.groupsUpdatedAt))queueRemote("groups",()=>({list:S.groups,updatedAt:S.groupsUpdatedAt}));
      if(changed){saveLocal();}
      if(changed||S.view==="history")render();
    }catch(e){S.remote="local";}
  }

  /* ---------- receipt photos: this device (IndexedDB) + the viewer's private store ---------- */
  const PH={mem:{},db:null,pending:[]};
  function idb(){
    if(PH.db)return PH.db;
    PH.db=new Promise(res=>{try{const r=indexedDB.open("splitbill-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});
    return PH.db;
  }
  async function idbGet(k){const d=await idb();if(!d)return PH.mem[k];return new Promise(res=>{try{const t=d.transaction("p").objectStore("p").get(k);t.onsuccess=()=>res(t.result||PH.mem[k]);t.onerror=()=>res(PH.mem[k]);}catch(e){res(PH.mem[k]);}});}
  async function idbPut(k,v){PH.mem[k]=v;const d=await idb();if(!d)return;try{d.transaction("p","readwrite").objectStore("p").put(v,k);}catch(e){}}
  async function idbDel(k){delete PH.mem[k];const d=await idb();if(!d)return;try{d.transaction("p","readwrite").objectStore("p").delete(k);}catch(e){}}
  async function remotePhotoSet(id,data){if(!R||R.off||!R.photos){PH.pending.push([id,data]);return;}try{await R.photos.doc(id).set({data,updatedAt:Date.now()});}catch(e){}}
  function flushPendingPhotos(){const q=PH.pending.splice(0);q.forEach(([id,data])=>remotePhotoSet(id,data));}
  async function savePhoto(id,data){await idbPut(id,data);remotePhotoSet(id,data);}
  async function loadPhoto(id){
    let v=await idbGet(id);
    if(!v&&R&&!R.off&&R.photos){try{const sn=await R.photos.doc(id).get();if(sn.exists){v=(sn.data()||{}).data;if(v)idbPut(id,v);}}catch(e){}}
    return v||null;
  }
  async function deletePhoto(id){await idbDel(id);if(R&&!R.off&&R.photos){try{await R.photos.doc(id).delete();}catch(e){}}}
  async function photoForStore(file){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
      let max=1400;
      for(let a=0;a<4;a++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        for(const q of [0.62,0.48,0.36]){const d=cv.toDataURL("image/jpeg",q);if(d.length<240000)return d;}
        max=Math.round(max*0.78);
      }
      return null;
    }catch(e){return null;}finally{setTimeout(()=>URL.revokeObjectURL(url),1000);}
  }

  /* ---------- calculation ---------- */
  function compute(b){
    const sub=b.items.reduce((a,i)=>a+(i.price||0),0);
    let run=sub;
    const charges=b.charges.map(c=>{const v=hasPct(c)?run*Number(c.pct)/100:(c.amount||0);run+=v;return {...c,value:v};});
    const chargeTotal=charges.reduce((a,c)=>a+c.value,0);
    const grand=sub+chargeTotal;
    const per={};b.people.forEach(p=>per[p.id]={sub:0,lines:[],charge:0,total:0,due:0});
    let unSub=0,unCount=0;
    b.items.forEach(it=>{
      const who=(it.who||[]).filter(id=>per[id]);
      if(!who.length){unSub+=it.price||0;unCount++;return;}
      const ws=who.map(id=>wOf(it,id));const tw=ws.reduce((a,x)=>a+x,0);const equal=ws.every(x=>x===ws[0]);
      who.forEach((id,k)=>{const v=(it.price||0)*ws[k]/tw;per[id].sub+=v;
        per[id].lines.push({name:it.name+(who.length>1?(equal?` ÷${who.length}`:` (${ws[k]}/${tw} porsi)`):""),v});});
    });
    const ratio=sub?chargeTotal/sub:0;
    const exact=b.people.map(p=>({id:p.id,v:per[p.id].sub*(1+ratio)}));
    const target=Math.round(exact.reduce((a,e)=>a+e.v,0));
    const fl=exact.map(e=>({id:e.id,f:Math.floor(e.v),r:e.v-Math.floor(e.v)}));
    let left=target-fl.reduce((a,f)=>a+f.f,0);
    [...fl].sort((x,y)=>y.r-x.r).forEach(f=>{if(left>0){f.f++;left--;}});
    fl.forEach(f=>{per[f.id].total=f.f;});
    const r=Number(b.round)||0;
    b.people.forEach(p=>{const d=per[p.id];d.charge=d.sub*ratio;d.due=r>0?Math.round(d.total/r)*r:d.total;});
    const isPaid=p=>!!p.paid||p.id===b.payerId;
    const assigned=b.people.reduce((a,p)=>a+per[p.id].total,0);
    const billed=b.people.reduce((a,p)=>a+per[p.id].due,0);
    const paid=b.people.filter(isPaid).reduce((a,p)=>a+per[p.id].due,0);

  }
  function wOf(it,id){return Math.max(1,Math.round((it.w&&it.w[id])||1));}
  function status(b,C){
    C=C||compute(b);

      const k=p.name.trim().toLowerCase();const m=map[k]||(map[k]={name:p.name.trim(),total:0,list:[]});m.total+=due;m.list.push({b,p,due});

  function personBills(slug){

  function relDate(ts){

      ${cards||(b.people.length?`<div class="empty">Belum ada item yang dibagi ke orang.<button type="button" class="btn sm teal" data-act="go-items">Bagi item</button></div>`:`<div class="empty">Belum ada orang di tagihan ini.<button type="button" class="btn sm teal" data-act="add-person">${I.plus}Tambah orang</button></div>`)}
      ${cards&&idle.length?`<p class="small" style="text-align:center">Tidak ditampilkan karena tidak ikut item: ${esc(idle.map(p=>p.name).join(", "))}</p>`:""}

  function render(){
    const v={home:vHome,history:vHistory,friends:vFriends,items:vItems,summary:vSummary,debt:vDebt,event:vEvent}[S.view]||vHome;
    $("app").innerHTML=v();
    if((S.view==="summary"&&cur()&&cur().people.length)||(S.view==="event"&&evOf(S.eventId)))setTimeout(prepareShot,30);
  }
  /* navigation: each screen (and an open sheet) is a #hash entry, so the phone's back button steps back inside the app */
  const SH="-lembar";const stk=[];let replacing=false,jumpTo=null;
  function hashFor(view){
    if(view==="history")return "#riwayat";if(view==="friends")return "#teman";
    if(view==="debt"&&S.debtSlug)return "#rekap-"+S.debtSlug;
    if(view==="event"&&S.eventId)return "#acara-"+S.eventId;
    if(view==="items"&&S.curId)return "#item-"+S.curId;if(view==="summary"&&S.curId)return "#tagihan-"+S.curId;
    return "#beranda";
  }
  function route(){
    const full=location.hash||"#beranda";
    if(jumpTo!==null&&stk[jumpTo]===full){stk.length=jumpTo+1;jumpTo=null;}
    else if(replacing){stk[stk.length-1]=full;replacing=false;}
    else if(stk.length>1&&stk[stk.length-2]===full)stk.pop();
    else if(stk[stk.length-1]!==full)stk.push(full);
    const sheetHash=full.endsWith(SH);const h=sheetHash?full.slice(0,-SH.length):full;
    if(!sheetHash&&$("sheetRoot").innerHTML){commitAssign();S.sheet=null;$("sheetRoot").innerHTML="";}
    let view="home";const m=h.match(/^#(item|tagihan)-([a-z0-9]+)$/);
    if(m){const b=S.bills[m[2]];if(b&&!b.deleted){S.curId=m[2];view=m[1]==="item"?"items":"summary";}}
    else if(h==="#riwayat")view="history";else if(h==="#teman")view="friends";
    else if(/^#rekap-[a-z0-9-]+$/.test(h)){S.debtSlug=h.slice(7);view="debt";}
    else if(/^#acara-[a-z0-9]+$/.test(h)&&evOf(h.slice(7))){S.eventId=h.slice(7);view="event";}
    Object.values(S.bills).forEach(b=>{if(isEmpty(b)&&b.id!==(m&&m[2]))delete S.bills[b.id];});
    const changed=view!==S.view;S.view=view;render();if(changed)window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);
  function go(view,replace){
    const h=hashFor(view);
    if(location.hash===h){S.view=view;render();return;}
    if(replace){replacing=true;location.replace(h);}else location.hash=h;
  }
  function okHome(){
    const i=stk.lastIndexOf("#beranda");
    if(i>=0&&i<stk.length-1){jumpTo=i;history.go(i-(stk.length-1));}
    else go("home",true);
  }
  function backTo(view){const h=hashFor(view);if(stk.length>1&&stk[stk.length-2]===h)history.back();else go(view,true);}

  /* ---------- sheets ---------- */
  function openSheet(html,locked){
    if(!location.hash.endsWith(SH))location.hash=(location.hash||"#beranda")+SH;
    $("sheetRoot").innerHTML=`<div class="backdrop" data-backdrop="${locked?"locked":"1"}"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  }
  function closeSheet(){commitAssign();S.sheet=null;$("sheetRoot").innerHTML="";if(location.hash.endsWith(SH))history.back();}
  function closeSheetAndGo(view){S.sheet=null;$("sheetRoot").innerHTML="";if(location.hash.endsWith(SH)){replacing=true;location.replace(hashFor(view));}else go(view);}
  $("sheetRoot").addEventListener("click",e=>{const bd=e.target.closest(".backdrop");if(bd&&e.target===bd&&bd.dataset.backdrop!=="locked"){closeSheet();render();}});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheetRoot").innerHTML&&!document.querySelector('[data-backdrop="locked"]')){closeSheet();render();}});
  const grab='<div class="grab" aria-hidden="true"></div>';

  /* assign / edit item */
  function sheetAssign(itemId,opt){
    opt=opt||{};const b=cur();const it=b.items.find(i=>i.id===itemId);if(!it)return;
    const idx=b.items.indexOf(it);
    S.sheet={type:"assign",itemId,edit:!!opt.edit,isNew:!!opt.isNew};
    const who=(it.who||[]).filter(id=>b.people.some(p=>p.id===id));
    const names=who.map(id=>b.people.find(p=>p.id===id).name);
    const ws=who.map(id=>wOf(it,id));const tw=ws.reduce((a,x)=>a+x,0)||1;const eq=ws.every(x=>x===ws[0]);
    const portions=who.length>=2?`<div class="wlist"><div class="sec-h" style="align-items:center"><b style="font-size:14px">Porsi</b>${eq?`<span class="small">Atur kalau tidak dibagi rata</span>`:`<button type="button" class="link" data-act="w-reset">Bagi rata lagi</button>`}</div>
      ${who.map((id,k)=>{const p=b.people.find(x=>x.id===id);return `<div class="wrow">${avatar(p)}<span class="wn">${esc(p.name)}</span>
        <span class="step"><button type="button" data-act="w-step" data-pid="${id}" data-d="-1" aria-label="Kurangi porsi ${esc(p.name)}" ${ws[k]<=1?"disabled":""}>−</button><b class="num">${ws[k]}</b><button type="button" data-act="w-step" data-pid="${id}" data-d="1" aria-label="Tambah porsi ${esc(p.name)}">+</button></span>
        <span class="wa num">${fmtN((it.price||0)*ws[k]/tw)}</span></div>`;}).join("")}</div>`:"";
    const next=b.items[idx+1];
    const edit=S.sheet.edit?`<div class="frow"><label class="lbl">Nama item<input class="inp" id="fName" value="${esc(it.name)}" autocomplete="off"></label></div>
      <div class="frow"><label class="lbl" style="flex:0 0 76px">Qty<input class="inp" id="fQty" inputmode="numeric" value="${it.qty||1}"></label><label class="lbl">Harga total baris (Rp)<input class="inp" id="fPrice" inputmode="numeric" value="${it.price?fmtN(it.price):""}" placeholder="0"></label></div>`:"";
    const ppl=b.people.length?`<div style="display:flex;flex-direction:column;gap:12px">
        <div class="sec-h" style="align-items:center"><b style="font-size:15px">Siapa yang makan?</b><button type="button" class="btn sm" data-act="pick-all">${who.length===b.people.length?"Kosongkan":"Pilih semua"}</button></div>
        <div class="pgrid">${b.people.map(p=>`<button type="button" class="pbtn" style="--c:${p.color}" data-act="toggle-who" data-pid="${p.id}" aria-pressed="${who.includes(p.id)}"><span class="ck">${I.check}</span><span class="av l" style="--c:${p.color}">${esc(ini(p.name))}</span><span class="nm">${esc(p.name)}</span></button>`).join("")}</div>
      </div>
      ${portions}
      <div class="hint">${I.split}<div>${who.length?`<b>${who.length>1?(eq?`Dibagi rata ke ${who.length} orang`:`Dibagi sesuai porsi ${ws.join(":")}`):`Ditanggung ${esc(names[0])}`}</b><span>${who.length>1?(eq?`${esc(names.join(", "))} masing-masing ${fmt((it.price||0)/who.length)}`:"Nominal tiap orang ada di daftar porsi"):`${fmt(it.price||0)} sebelum pajak`}</span>`:`<b>Belum ada yang dipilih</b><span>Tap nama orang yang ikut makan item ini.</span>`}</div></div>`
      :`<div class="empty">Belum ada orang di tagihan ini.<button type="button" class="btn sm teal" data-act="add-person">${I.plus}Tambah orang</button></div>`;
    openSheet(`${grab}<div class="sh"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="k">${opt.isNew?"Item baru":`Item ${idx+1} dari ${b.items.length}`}</span><h2>${esc(it.name||"Item baru")}</h2></div><span class="pr num">${fmt(it.price||0)}</span></div>
      ${edit}${ppl}
      <div class="sacts">${S.sheet.edit?`<button type="button" class="btn danger" data-act="assign-del">Hapus</button>`:`<button type="button" class="btn" data-act="assign-edit">${I.edit}Edit item</button>`}
      <button type="button" class="btn teal big grow" data-act="assign-save" data-next="${next&&!opt.isNew?next.id:""}">${next&&!opt.isNew?"Simpan &amp; berikutnya":"Simpan"}</button></div>`);
    if(opt.isNew)setTimeout(()=>{const f=$("fName");f&&f.focus();},60);
  }
  function commitAssign(){
    if(!S.sheet||S.sheet.type!=="assign"||!S.sheet.edit)return;
    const b=cur();const it=b&&b.items.find(i=>i.id===S.sheet.itemId);if(!it||!$("fName"))return;
    it.name=$("fName").value.trim();it.qty=Math.max(1,num($("fQty").value)||1);it.price=Math.abs(num($("fPrice").value));
  }

  /* charges */
  function sheetCharges(){
    const b=cur();S.sheet={type:"charges"};
    const C=compute(b);
    const rows=b.charges.map((c,i)=>`<div class="crow" data-cid="${c.id}">

  function toast(m,actLabel,fn){

    if(actLabel)t.querySelector(".tact").onclick=()=>{t.classList.remove("show");fn();};

  async function backupDownload(withPhotos){
    const bills={};billList().forEach(b=>{bills[b.id]=b;});
    const settings=Object.assign({},S.settings);delete settings.accessCode;
    const data={app:"splitbill",v:2,exportedAt:new Date().toISOString(),bills,groups:S.groups,events:S.events,settings};
    if(withPhotos){data.photos={};for(const b of Object.values(bills)){if(b.hasPhoto){const ph=await loadPhoto(b.id);if(ph)data.photos[b.id]=ph;}}}
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const name="splitbill-cadangan-"+new Date().toISOString().slice(0,10)+".json";
    if(downloadsCap){downloadsCap.save({filename:name,data:blob}).then(()=>toast("Cadangan disimpan"),e=>{if(!e||e.code!=="declined")toast("Tidak bisa menyimpan file di sini");});return;}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(`Cadangan diunduh (${Object.keys(bills).length} tagihan)`);
  }
  async function backupRestore(file){
    let d;try{d=JSON.parse(await file.text());}catch(e){toast("File cadangan tidak bisa dibaca");return;}
    if(!d||d.app!=="splitbill"||!d.bills){toast("Ini bukan file cadangan Split Bill");return;}
    let n=0;
    Object.values(d.bills).forEach(b=>{if(!b||!b.id)return;const mine=S.bills[b.id];if(!mine||(b.updatedAt||0)>(mine.updatedAt||0)){S.bills[b.id]=b;n++;const id=b.id;queueRemote("bill-"+id,()=>({bill:S.bills[id]}));}});
    (d.groups||[]).forEach(g=>{if(g&&g.id&&!S.groups.some(x=>x.id===g.id))S.groups.push(g);});
    (d.events||[]).forEach(e=>{if(e&&e.id&&!S.events.some(x=>x.id===e.id))S.events.push(e);});
    if(d.settings){["myName","payInfo"].forEach(k=>{if(!S.settings[k]&&d.settings[k])S.settings[k]=d.settings[k];});if(d.settings.workerUrl&&!S.settings.workerUrl)S.settings.workerUrl=d.settings.workerUrl;}
    if(d.photos)for(const [id,ph] of Object.entries(d.photos)){if(typeof ph==="string"&&ph.startsWith("data:image/"))await savePhoto(id,ph);}
    saveLocal();saveGroups();saveEvents();saveSettings();
    closeSheet();render();toast(`${n} tagihan dipulihkan`);
  }

  function copyText(){
    if(S.view==="event"){const ev=evOf(S.eventId),E=evCompute(ev);
      const L=[`Rekap ${ev.name} (${E.bills.length} struk)`,""];
      E.people.forEach(x=>L.push(`${x.name}: ${fmt(x.open>0?x.open:x.due)}${x.open<=0?" (lunas)":x.open!==x.due?` (sisa dari ${fmt(x.due)})`:""}`));
      L.push("",...E.bills.map(b=>{const C=compute(b);const pr=payerOf(b);return `• ${b.title}: ${fmt(C.grand+C.roundDiff)}${pr?` (ditalangi ${pr.name})`:""}`;}));
      L.push(`Total acara: ${fmt(E.grand)}`);if(S.settings.payInfo)L.push("",`Transfer ke: ${oneLine(S.settings.payInfo)}`);
      navigator.clipboard.writeText(L.join("\n")).then(()=>toast("Rekap acara disalin"),()=>toast("Tidak bisa menyalin otomatis di sini"));return;}
    const b=cur();const C=compute(b);
    const lines=[`Split bill · ${b.title} (${dateShort(b.createdAt)})`,""];
    activeOf(b,C).forEach(p=>lines.push(`${p.name}: ${fmt(C.per[p.id].due)}${p.id===b.payerId?" (menalangi)":p.paid?" (lunas)":""}`));
    lines.push("",`Total: ${fmt(C.grand+C.roundDiff)}${C.charges.length?` (termasuk ${C.charges.map(c=>c.name).join(", ")})`:""}`);
    if(C.roundDiff)lines.push(`Sudah dibulatkan ke ${fmtN(b.round)} terdekat`);
    if(C.unCount)lines.push(`Belum dibagi: ${fmt(C.unTotal)}`);
    const to=payTo(b);if(to)lines.push("",`Bayar ke: ${to}`);
    navigator.clipboard.writeText(lines.join("\n")).then(()=>toast("Ringkasan disalin"),()=>toast("Tidak bisa menyalin otomatis di sini"));
  }
  function wrapText(ctx,t,max){
    const words=String(t).split(/\s+/).filter(Boolean),out=[];let line="";
    const brk=w=>{while(ctx.measureText(w).width>max&&w.length>1){let i=w.length;while(i>1&&ctx.measureText(w.slice(0,i)).width>max)i--;out.push(w.slice(0,i));w=w.slice(i);}return w;};
    words.forEach(w=>{const t2=line?line+" "+w:w;if(ctx.measureText(t2).width<=max)line=t2;else{if(line)out.push(line);line=brk(w);}});
    if(line)out.push(line);return out.length?out:[""];
  }
  function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawBill(ctx,b,C,W){
    const P={bg:"#f3f4f1",paper:"#ffffff",ink:"#15191e",muted:"#5c6670",line:"#e3e6e0",teal:"#0f766e",tealSoft:"#dff2ee",tealInk:"#0b5d56",yellow:"#ffd23f",dark:"#15191e",dark2:"#2a3038"};
    const F='"Plus Jakarta Sans",system-ui,sans-serif';

      [/(ppn|vat)/i,"PPN",1],[/pb\s*-?\s*[1l]/i,"PB1",1],[/(pajak|tax)/i,"Pajak",1],
      [/(service|servis|svc|layanan)/i,"Service",1],[/(diskon|discount|disc\b|potongan|promo|voucher)/i,"Diskon",-1],
      [/(pembulatan|rounding)/i,"Pembulatan",0],[/(kemasan|packaging|bungkus|take\s*away\s*fee)/i,"Biaya kemasan",1]
    ];
    const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
    const items=[],charges=[];let total=null,pendingName=null,merchant=null;
    lines.forEach((line,idx)=>{
      const prices=line.match(PRICE_RE)||[];
      const letters=line.replace(/[^A-Za-z]/g,"");
      if(!merchant&&idx<3&&letters.length>=3&&!prices.length&&!SKIP.test(line))merchant=line.slice(0,40);
      if(!prices.length){
        // a name whose price may sit on the next line
        pendingName=(letters.length>=3&&!SKIP.test(line)&&!TOTAL.test(line))?line:null;
        return;
      }
      const last=prices[prices.length-1];
      let amount=toRupiah(last);
      let label=line.slice(0,line.lastIndexOf(last)).trim();
      if(label.replace(/[^A-Za-z]/g,"").length<2&&pendingName){label=(pendingName+" "+label).trim();}
      pendingName=null;
      const lbl=label.toLowerCase();
      if(TOTAL.test(lbl)&&!/sub\s*-?\s*total/i.test(lbl)){if(Math.abs(amount)>(total||0))total=Math.abs(amount);return;}
      if(SKIP.test(lbl))return;
      const ch=CHG.find(c=>c[0].test(lbl));
      if(ch){
        const pct=(lbl.match(/(\d{1,2}(?:[.,]\d+)?)\s*%/)||[])[1];
        const name=ch[1]+(pct?` ${pct.replace(",",".")}%`:"");
        const signed=ch[2]===-1?-Math.abs(amount):ch[2]===1?Math.abs(amount):amount;
        if(signed)charges.push({name,amount:signed});return;
      }
      if(Math.abs(amount)<500)return; // too small to be a rupiah price; likely noise
      // qty: "2x Nasi", "2 x Nasi", "Nasi 2 x 12.000", or "2 Nasi ... 24.000"
      let qty=1,name=label;
      let m=name.match(/^(\d{1,2})\s*[xX×]\s*(.+)$/)||name.match(/^(\d{1,2})\s+(?=[A-Za-z])(.+)$/);
      if(m){qty=parseInt(m[1],10);name=m[2];}
      m=name.match(/^(.*?)\s+(\d{1,2})\s*[xX×@]\s*$/)||name.match(/^(.*?)\s+(\d{1,2})\s*[xX×@]?\s*-?\d{1,3}(?:[.,]\d{3})+\s*$/);
      if(m){name=m[1];qty=parseInt(m[2],10)||qty;}
      name=name.replace(PRICE_RE,"").replace(/[@:=*]+/g," ").replace(/\s+/g," ").trim();
      if(name.replace(/[^A-Za-z]/g,"").length<2)return;
      items.push({name,qty:Math.max(1,qty),price:Math.abs(amount)});
    });
    return {merchant,items,charges,total,tax_included_note:null,ocr:true};
  }
  async function readWithOCR(file,onProgress){
    const T=await loadTesseract();
    const canvas=await prepForOCR(file);
    const r=await T.recognize(canvas,"ind+eng",{logger:m=>{if(m.status==="recognizing text")onProgress(Math.round(m.progress*100));else if(/load/.test(m.status||""))onProgress(null,m.status);}});
    return parseReceiptText((r&&r.data&&r.data.text)||"");
  }


  const workerBase=()=>String(S.settings.workerUrl||"").trim().replace(/\/+$/,"");
  function deviceId(){
    let d=null;try{d=localStorage.getItem("splitbill-device");}catch(e){}
    if(!d||!/^[a-z0-9-]{8,64}$/i.test(d)){d=(crypto.randomUUID?crypto.randomUUID():uid()+"-"+uid());try{localStorage.setItem("splitbill-device",d);}catch(e){}}
    return d;
  }
  let legacyServer=false;
  async function workerFetch(url,opt){
    const h=Object.assign({},opt.headers);
    if(!legacyServer){
      try{return await fetch(url,Object.assign({},opt,{headers:Object.assign({},h,{"x-device-id":deviceId()})}));}
      catch(e){if(e&&e.name==="AbortError")throw e;}
    }
    const r=await fetch(url,Object.assign({},opt,{headers:h}));legacyServer=true;return r;
  }
  async function readWithWorker(file){
    const blob=await shrink(file);
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob);});
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),90000);let resp;
    try{resp=await workerFetch(workerBase(),{method:"POST",headers:{"content-type":"text/plain","x-access-code":S.settings.accessCode||""},body:b64,signal:ctl.signal});}
    catch(e){throw new Error(e&&e.name==="AbortError"?"Server terlalu lama menjawab. Coba lagi.":"Server pembaca struk tidak bisa dihubungi. Cek internet atau alamat server di Pengaturan.");}
    finally{clearTimeout(t);}
    let j={};try{j=await resp.json();}catch(e){}
    if(!resp.ok)throw new Error(j.error||`Server menolak permintaan (kode ${resp.status}).`);
    return parseJSON(j.text);
  }
  async function testWorker(){
    const out=$("testRes");const say=(t,ok)=>{if(out){out.textContent=t;out.style.color=ok?"var(--teal-ink)":"var(--danger)";}};
    const url=$("setWorker").value.trim().replace(/\/+$/,"");if(!url){say("Isi alamat server dulu.");return;}
    say("Menghubungi server…",true);
    try{legacyServer=false;const r=await workerFetch(url,{headers:{"x-access-code":$("setCode").value.trim()}});let j={};try{j=await r.json();}catch(e){}
      if(r.ok&&j.ok)say(legacyServer?"Tersambung, tapi server masih versi lama. Tempel ulang worker.js terbaru di Cloudflare supaya kode per teman bisa dipakai."
        :`Tersambung sebagai ${j.name||"pengguna"}. ${j.remaining==null?"Tanpa batas harian.":`Sisa hari ini: ${j.remaining} dari ${j.limit} scan.`}`,true);
      else say(j.error||`Gagal (kode ${r.status}).`);}
    catch(e){say("Tidak bisa terhubung. Cek alamat server dan izin ALLOWED_ORIGIN.");}
  }
  let sampleFn=null,modeReady;const modePromise=new Promise(r=>modeReady=r);
  function scanSheet(html){S.sheet={type:"scan"};openSheet(`${grab}${html}`,true);}
  async function handleScan(file,into,eventId){
    const photoP=photoForStore(file);
    scanSheet(`<div class="spin" aria-hidden="true"></div><div style="text-align:center;display:flex;flex-direction:column;gap:4px"><b style="font-size:17px">Membaca struk…</b><span class="small" id="scanMsg">Menyiapkan…</span></div>`);
    const say=t=>{const el=$("scanMsg");if(el)el.textContent=t;};
    try{
      await modePromise;let data;
      if(sampleFn){
        say("Sedang membaca item, pajak dan diskon. Biasanya 10–30 detik.");
        const blob=await shrink(file);const r=await sampleFn(PROMPT,{images:[blob],modelTier:"default"});data=parseJSON(r.text);
      }else if(S.aiMode==="worker"){
        say("Sedang membaca item, pajak dan diskon. Biasanya 10–30 detik.");
        data=await readWithWorker(file);
      }else{
        say("Mengunduh mesin OCR… (sekali saja)");
        data=await readWithOCR(file,(p)=>say(p===null?"Menyiapkan mesin OCR…":`Membaca teks struk… ${p}%`));
      }
      const items=(data.items||[]).filter(i=>i&&i.name).map(i=>({id:uid(),name:String(i.name).trim(),qty:Math.max(1,Math.round(Number(i.qty)||1)),price:Math.abs(Math.round(Number(i.price)||0)),who:[]}));
      if(!items.length)throw new Error(data.tax_included_note==="bukan struk"?"Foto ini sepertinya bukan struk.":"Tidak ada item yang terbaca. Coba foto lebih dekat, lurus dan terang.");
      const charges=(data.charges||[]).filter(c=>c&&c.name&&Number(c.amount)).map(c=>({id:uid(),name:String(c.name).trim(),pct:null,amount:Math.round(Number(c.amount))}));
      let b=into&&S.bills[into]&&!S.bills[into].deleted?S.bills[into]:(eventId&&evOf(eventId)?newBillInEvent(evOf(eventId),data.merchant||null):newBill(data.merchant||null));
      if(data.merchant&&(!into||/^Tagihan /.test(b.title)))b.title=String(data.merchant).slice(0,60);
      b.items=items;b.charges=charges;b.receiptTotal=Number(data.total)||null;b.fromScan=true;
      try{const ph=await photoP;if(ph){await savePhoto(b.id,ph);b.hasPhoto=true;}}catch(e){}
      saveBill(b);S.curId=b.id;closeSheetAndGo("items");
      toast(`${items.length} item terbaca${data.ocr?". Cek lagi hasilnya":""}`);
      if(!b.people.length)sheetAddPerson();
    }catch(err){
      const m=err&&err.code==="rate_limited"?"Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.":err&&err.code==="not_granted"?"Izin membaca struk belum diberikan.":(err&&err.message)||"Gagal membaca struk.";
      scanSheet(`<div class="sh"><h2>Struk belum terbaca</h2></div><p style="margin:0">${esc(m)}</p>
        <label class="btn teal big">${I.cam}Coba foto lagi<input type="file" accept="image/*" data-scan="${into||""}" data-event="${eventId||""}"></label>
        <div class="sacts"><button type="button" class="btn grow" data-act="scan-manual" data-into="${esc(into||"")}">Isi manual</button><button type="button" class="btn grow" data-act="sheet-done">Tutup</button></div>`);
    }
  }
  A["scan-manual"]=el=>{const id=el.dataset.into;
    if(id&&S.bills[id]){S.curId=id;closeSheetAndGo("items");A["add-item"]();}
    else{const b=newBill();saveBill(b);S.curId=b.id;closeSheetAndGo("items");sheetAddPerson();}};
  document.addEventListener("change",e=>{
    const inp=e.target;if(!inp.matches)return;
    if(inp.matches("input[data-attach]")){const f=inp.files&&inp.files[0];const id=inp.dataset.attach;inp.value="";if(!f||!S.bills[id])return;
      toast("Menyimpan foto struk…");photoForStore(f).then(async ph=>{if(!ph){toast("Foto tidak bisa disimpan");return;}await savePhoto(id,ph);const b=S.bills[id];b.hasPhoto=true;saveBill(b);
        if(S.sheet&&S.sheet.type==="photo")sheetPhoto(id);render();toast("Foto struk tersimpan");});return;}
    if(inp.matches("input[data-restore]")){const f=inp.files&&inp.files[0];inp.value="";if(f)backupRestore(f);return;}
    if(!inp.matches("input[data-scan]"))return;
    const f=inp.files&&inp.files[0];const into=inp.dataset.scan||null;const ev=inp.dataset.event||null;inp.value="";if(f)handleScan(f,into,ev);
  });

  if(location.hash.endsWith(SH)){replacing=false;location.replace(location.hash.slice(0,-SH.length));}
  stk.push(location.hash||"#beranda");route();
  if(inviteApplied)setTimeout(()=>toast("Kode akses dari undangan sudah terpasang"),400);
  (async()=>{
    try{
      const w=window.claude;const s=w&&w.use?await w.use("sample"):null;
      if(s){let ok=true;try{const L=await s.limits();ok=!!(L&&L.images);}catch(e){}if(ok){sampleFn=s;S.aiMode="claude";modeReady();render();return;}}
    }catch(e){}
    S.aiMode=S.settings.workerUrl?"worker":"ocr";modeReady();render();if(S.aiMode==="ocr")loadTesseract().catch(()=>{});
  })();
  (async()=>{try{const w=window.claude;downloadsCap=w&&w.use?await w.use("downloads"):null;}catch(e){}})();
  initRemote();
})();
</script>
<script>
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>
